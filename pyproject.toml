[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factcheck"
version = "0.1.0"
description = "Checks the claims a project's documentation makes against the repository it documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
factcheck = "factcheck.cli:main"

[tool.setuptools]
packages = ["factcheck", "factcheck.checks", "factcheck.mdcore"]
