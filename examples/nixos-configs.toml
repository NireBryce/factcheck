# factcheck configuration for a checkout of the NireBryce/nixos-configs
# repository. Run read-only against a checkout:
#
#     factcheck check --root ~/nixos --config examples/nixos-configs.toml
#
# This file is the dogfood harness until that repo adopts factcheck (its
# own copy of this config would then live at its root, with the plugin
# paths in-repo). Sections left out fall back to the tool's defaults,
# which are this repo's conventions.

[scopes]
docs = ["wiki/**/*.md", "AGENTS.md", ".agents/rules/**/*.md"]
pages = ["wiki/**/*.md"]

[dates]
line = '_Last modified: {date}_'

[contents]
exempt = ['^wiki/agent-lessons-learned(\.md|/)', '-for-agents\.md$']

[siblings]
suffix = "-for-agents"
required-words = 1000
budget = 0.5
fold-heading = "Quick facts"
exempt = ['^wiki/agent-lessons-learned(\.md|/)', '-history\.md$']

[recipes]
justfile = ".justfile"

[skills]
dirs = [".agents/skills"]

# Repo data: directory roots that moved, where a doc still naming the old
# path is a finding. Adding a future move is one line here.
[docrefs]
moved-dirs = { ".claude/hooks" = ".agents/hooks" }

# The host-roster counters for `counts`, read statically from hosts.nix
# (no nix evaluation). Absolute path because the plugin lives in this
# repo until the flip; it moves into nixos-configs then.
[plugins]
load = ["/home/elly/projects/agents/factcheck/examples/nixos-plugins/roster.py"]

[roster]
file = "flake/modules/host-config/hosts.nix"
name-prefix = "nire-"

# The generated regions are defined by the repo's own region plugin,
# which does not exist until the flip -- the in-repo wiki_gen.py still
# owns them, so the engine's check stays off here.
[checks]
disabled = ["generated"]
