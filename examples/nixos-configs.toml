# factcheck configuration for a checkout of the NireBryce/nixos-configs
# repository. Run read-only against a checkout:
#
#     factcheck check --root ~/nixos --config examples/nixos-configs.toml
#
# This file is the dogfood harness until that repo adopts factcheck (its
# own copy of this config would then live at its root, with the plugin
# paths in-repo). Sections left out fall back to the tool's defaults,
# which are this repo's conventions.

[scopes]
docs = ["wiki/**/*.md", "AGENTS.md", ".agents/rules/**/*.md"]
pages = ["wiki/**/*.md"]

[dates]
line = '_Last modified: {date}_'

[contents]
exempt = ['^wiki/agent-lessons-learned(\.md|/)', '-for-agents\.md$']

[siblings]
suffix = "-for-agents"
required-words = 1000
budget = 0.5
fold-heading = "Quick facts"
exempt = ['^wiki/agent-lessons-learned(\.md|/)', '-history\.md$']

[recipes]
justfile = ".justfile"

[skills]
dirs = [".agents/skills"]

# Repo data: directory roots that moved, where a doc still naming the old
# path is a finding. Adding a future move is one line here.
[docrefs]
moved-dirs = { ".claude/hooks" = ".agents/hooks" }

# The fleet's plugins: the static tree reader, the membership checks
# built on it, the two set-claim checks, and the
# generated regions. Absolute paths because these live in this repo
# until the flip; they move into nixos-configs' own plugins/ then.
# Everything fleet-specific in their OUTPUT (host names, routes) comes
# from the configured sources at runtime.
[plugins]
load = [
  "/home/elly/projects/agents/factcheck/examples/nixos-plugins/tree.py",
  "/home/elly/projects/agents/factcheck/examples/nixos-plugins/imports_table.py",
  "/home/elly/projects/agents/factcheck/examples/nixos-plugins/secrets.py",
  "/home/elly/projects/agents/factcheck/examples/nixos-plugins/routes.py",
  "/home/elly/projects/agents/factcheck/examples/nixos-plugins/nixos_regions.py",
]

[roster]
file = "flake/modules/host-config/hosts.nix"
name-prefix = "nire-"

[tree]
modules = "flake/modules"
areas = ["general-config", "hardware-config", "homelab-config", "users-config"]
hosts-file = "flake/modules/host-config/hosts.nix"
host-config-dir = "flake/modules/host-config"
name-prefix = "nire-"
host-constructors = { nixos = "mkHost", darwin = "mkDarwinHost" }

[imports]
pages-dir = "wiki/config-structure/categories"
class-label = "NixOS"
index-page = "wiki/config-structure/categories/00-INDEX.md"

[secrets]
file = "flake/modules/general-config/system/secrets/.sops.yaml"
name-prefix = "nire-"

[routes]
sources = ["flake/modules/homelab-config/homelab/reverse-proxy/caddy/caddy.nix",
           "wiki/config-structure/categories/reverse-proxy-history.md"]
base-domain = "ts-cube.moose-micro.ts.net"

# Read by the built-in `lessons-index` check (once an example plugin).
[lessons]
page = "wiki/agent-lessons-learned.md"
dir = "wiki/agent-lessons-learned"

[regions]
flake = "flake"
homelab = "homelab-config/homelab"
pages-dir = "wiki/config-structure/categories"
tailnet-template = "ts-{short}"
wipes-import = "impermanence"

# The lessons-map half of `lessons` is not in the example plugin: its
# glob semantics is a single shared module three readers in
# nixos-configs import so they cannot disagree. Until the flip, the
# in-repo checker still validates the map, so the plugin's half is
# disabled here to avoid double-reporting the index.
[checks]
disabled = ["lessons"]
