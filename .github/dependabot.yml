# The third-party Actions in .github/workflows/ are pinned to commit
# SHAs (supply-chain hardening) -- Dependabot is what keeps those pins
# from going silently stale: it reads each `# vX` comment for the
# version label and opens one PR per update. Weekly is plenty for a
# single-workflow repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
