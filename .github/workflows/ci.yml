name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # The contributors' command itself, not a copy of its steps: a step
      # added to scripts/check gates PRs with no edit here.
      - run: scripts/check

  # A PR's own commits carry the canonical agent trailer (AGENTS.md,
  # Conventions). Covers clones that never wired .githooks/commit-msg.
  trailers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # HEAD is the PR merge ref: ^1 is the base, ^2 the PR head, so the
      # range is exactly the PR's commits even after the base moved.
      - run: python3 scripts/check_trailers.py HEAD^1..HEAD^2
